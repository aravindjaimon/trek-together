<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trek Together">
  <defs>
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18201b"/>
      <stop offset="1" stop-color="#10140f"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: opaque so transparent + maskable variants both read intentionally. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Same glyph as the in-app BrandMark (contour rings + blaze-orange trail + start
       node), scaled into the maskable safe zone. Theme tokens resolved to hex:
       primary green oklch(0.72 0.13 158) ≈ #50BD85, trail oklch(0.72 0.17 52) ≈ #F58028. -->
  <g transform="translate(512 512) scale(34) translate(-12 -12)">
    <!-- Contour rings (opacities mirror BrandMark's /35 and /60, nudged up so they
         survive downscaling to a 64px favicon). -->
    <path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6Z"
          fill="none" stroke="#50BD85" stroke-opacity="0.42" stroke-width="1.4"/>
    <path d="M12 6.6a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8Z"
          fill="none" stroke="#50BD85" stroke-opacity="0.7" stroke-width="1.4"/>
    <!-- Trail across the terrain -->
    <path d="M4.5 15.5c2.4.2 3.1-2.3 5-2.6 2.2-.34 2.8 2.1 5 1.6 1.9-.44 2.3-3.1 4.8-3"
          fill="none" stroke="#F58028" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Start node -->
    <circle cx="4.5" cy="15.5" r="1.7" fill="#F58028"/>
  </g>
</svg>
