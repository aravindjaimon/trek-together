name: trek-together

services:
  mongodb:
    image: mongo
    container_name: trek-together-mongodb
    # Run as a single-node replica set — Prisma's MongoDB connector requires one
    # for transactions (Better-Auth uses them). Auth is intentionally OFF for local
    # dev: replica-set internal auth needs a keyfile, which is overkill locally.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - trek-together_mongodb_data:/data/db
    # Self-initiate the replica set: the first probe (rs.status throws → not yet
    # configured) runs rs.initiate() and reports unhealthy; the next probe sees
    # rs.status().ok === 1 and reports healthy.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok === 1 ? quit(0) : quit(1) } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  trek-together_mongodb_data:
